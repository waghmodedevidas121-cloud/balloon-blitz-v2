<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BD68C"/><stop offset="1" stop-color="#7CC178"/>
    </linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67B461"/><stop offset="1" stop-color="#4E9A55"/>
    </linearGradient>
    <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#41894F"/><stop offset="1" stop-color="#357243"/>
    </linearGradient>
    <radialGradient id="bA" cx=".34" cy=".28" r=".78">
      <stop offset="0" stop-color="#FFF0F4"/><stop offset=".45" stop-color="#F0838C"/><stop offset="1" stop-color="#D9483F"/>
    </radialGradient>
    <radialGradient id="bB" cx=".34" cy=".28" r=".78">
      <stop offset="0" stop-color="#FFF8E4"/><stop offset=".45" stop-color="#FFC85C"/><stop offset="1" stop-color="#D9822B"/>
    </radialGradient>
    <radialGradient id="bC" cx=".34" cy=".28" r=".78">
      <stop offset="0" stop-color="#EEF7FF"/><stop offset=".45" stop-color="#84C6F0"/><stop offset="1" stop-color="#3E8FBF"/>
    </radialGradient>
    <g id="blade">
      <path d="M0 -2 L26 -7 L26 3 L0 2 Z" fill="#FFF7E6" stroke="rgba(110,91,84,.45)" stroke-width="1"/>
    </g>
  </defs>

  <!-- rolling hills -->
  <path d="M0 250 C90 218 170 246 250 232 C340 216 430 244 520 228 C570 219 610 228 640 224 L640 360 L0 360 Z" fill="url(#h1)"/>
  <path d="M0 284 C80 262 150 288 240 274 C330 260 420 288 510 272 C566 262 606 272 640 266 L640 360 L0 360 Z" fill="url(#h2)"/>
  <path d="M0 318 C70 302 160 322 250 312 C350 300 440 320 540 310 C580 306 616 312 640 308 L640 360 L0 360 Z" fill="url(#h3)"/>

  <!-- windmill -->
  <g transform="translate(126 232)">
    <path d="M-11 0 L-7 -54 L7 -54 L11 0 Z" fill="#FFF7E6" stroke="rgba(110,91,84,.3)"/>
    <path d="M-10 -53 L0 -66 L10 -53 Z" fill="#F5A524"/>
    <rect x="-4.5" y="-28" width="9" height="8" fill="rgba(110,91,84,.3)"/>
    <g transform="translate(0 -56)">
      <use href="#blade" transform="rotate(20)"/>
      <use href="#blade" transform="rotate(110)"/>
      <use href="#blade" transform="rotate(200)"/>
      <use href="#blade" transform="rotate(290)"/>
      <circle r="3" fill="#F5A524"/>
    </g>
  </g>

  <!-- cottage -->
  <g transform="translate(470 292)">
    <rect x="-16" y="-18" width="32" height="18" fill="#FFF7E6"/>
    <path d="M-20 -18 L0 -34 L20 -18 Z" fill="#E2565B"/>
    <rect x="-4" y="-13" width="8" height="8" fill="#F5A524"/>
  </g>

  <!-- balloons -->
  <g>
    <path d="M200 118 C200 150 208 158 208 168" stroke="rgba(110,91,84,.5)" stroke-width="1.6" fill="none"/>
    <ellipse cx="200" cy="96" rx="34" ry="40" fill="url(#bA)"/>
    <path d="M194 134 h12 l-3 8 h-6 z" fill="#B9403A"/>
    <ellipse cx="189" cy="80" rx="8" ry="12" fill="#fff" opacity=".45"/>
  </g>
  <g>
    <path d="M330 92 C330 128 322 136 322 148" stroke="rgba(110,91,84,.5)" stroke-width="1.6" fill="none"/>
    <ellipse cx="330" cy="66" rx="42" ry="49" fill="url(#bB)"/>
    <path d="M323 112 h14 l-3 9 h-8 z" fill="#B96A1E"/>
    <ellipse cx="317" cy="48" rx="9" ry="14" fill="#fff" opacity=".45"/>
  </g>
  <g>
    <path d="M452 140 C452 168 460 176 460 186" stroke="rgba(110,91,84,.5)" stroke-width="1.6" fill="none"/>
    <ellipse cx="452" cy="120" rx="29" ry="34" fill="url(#bC)"/>
    <path d="M447 152 h10 l-2 7 h-6 z" fill="#2F7BA6"/>
    <ellipse cx="443" cy="107" rx="7" ry="10" fill="#fff" opacity=".45"/>
  </g>

  <!-- birds -->
  <g stroke="rgba(72,55,48,.55)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M76 74 q7 -7 14 0"/>
    <path d="M96 62 q7 -7 14 0"/>
    <path d="M556 96 q7 -7 14 0"/>
  </g>

  <!-- flowers -->
  <g fill="#FFF7E6" opacity=".8">
    <circle cx="60" cy="330" r="2.4"/><circle cx="148" cy="340" r="2"/><circle cx="250" cy="332" r="2.6"/>
    <circle cx="352" cy="344" r="2"/><circle cx="440" cy="334" r="2.4"/><circle cx="560" cy="342" r="2"/>
  </g>
  <g fill="#FFE27A" opacity=".9">
    <circle cx="104" cy="338" r="2"/><circle cx="300" cy="346" r="2"/><circle cx="500" cy="338" r="2"/>
  </g>
</svg>
