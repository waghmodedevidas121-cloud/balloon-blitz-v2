<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD0FF"/>
      <stop offset=".38" stop-color="#BCE7FF"/>
      <stop offset=".70" stop-color="#E7F6FF"/>
      <stop offset="1" stop-color="#FFF6E1"/>
    </linearGradient>
    <radialGradient id="sun" cx=".78" cy=".16" r=".42">
      <stop offset="0" stop-color="#FFFCE8" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#F5A524" stop-opacity=".22"/>
      <stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7E6" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFF7E6" stop-opacity=".55"/>
    </linearGradient>
    <g id="puff">
      <circle cx="-52" cy="6" r="26"/>
      <circle cx="-20" cy="-10" r="36"/>
      <circle cx="18" cy="-4" r="30"/>
      <circle cx="52" cy="8" r="22"/>
      <rect x="-58" y="6" width="116" height="24" rx="12"/>
    </g>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect width="1200" height="800" fill="url(#sun)"/>
  <circle cx="936" cy="128" r="44" fill="#FFFDF0" opacity=".85"/>

  <g fill="#E2EFFB" opacity=".85">
    <use href="#puff" transform="translate(200 176) scale(1.25)"/>
    <use href="#puff" transform="translate(620 122) scale(.95)"/>
    <use href="#puff" transform="translate(1010 268) scale(1.1)"/>
    <use href="#puff" transform="translate(410 330) scale(.8)"/>
    <use href="#puff" transform="translate(820 400) scale(1.35)"/>
    <use href="#puff" transform="translate(120 470) scale(1)"/>
  </g>
  <g fill="#FFFDF7">
    <use href="#puff" transform="translate(200 168) scale(1.25)"/>
    <use href="#puff" transform="translate(620 114) scale(.95)"/>
    <use href="#puff" transform="translate(1010 260) scale(1.1)"/>
    <use href="#puff" transform="translate(410 322) scale(.8)"/>
    <use href="#puff" transform="translate(820 392) scale(1.35)"/>
    <use href="#puff" transform="translate(120 462) scale(1)"/>
  </g>

  <g fill="#FFFDF7" opacity=".72">
    <use href="#puff" transform="translate(300 620) scale(1.8)"/>
    <use href="#puff" transform="translate(760 660) scale(2.1)"/>
    <use href="#puff" transform="translate(1120 600) scale(1.6)"/>
  </g>

  <rect y="420" width="1200" height="380" fill="url(#haze)"/>
</svg>
